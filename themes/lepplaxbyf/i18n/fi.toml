[about_eyebrow]
other = "YHDESSÄOLOON JA JUHLAAN"

[about_title]
other = "Tilaa kaikelle, mitä haluatte juhlia."

[about_description]
other = "Täällä on tilaa niin elämän suurille juhlapäiville kuin pienille yhteisille hetkille. Talo odottaa täyttyvänsä ihmisistä, keskusteluista ja muistoista."

[feature_kitchen_title]
other = "Keittiö on valmiina"

[feature_kitchen_description]
other = """Hyvin varustellussa keittiössä on runsaasti työskentelytilaa sekä ruoka- ja kahviastiastot 160 hengelle. Keittiön varusteluun kuuluvat suuri kylmähuone, uuni, liesi, keittopata, astianpesukone, kahvinkeitin ja ruoan lämpimänä pitämiseen tarkoitettu lämpölevy. Alakerrassa on lisäksi kaksi suurta jääkaappia ja pakastin."""

[feature_gather_title]
other = "Juhlasali valmiina juhlaan"

[feature_gather_description]
other = """Valoisa juhlasali sopii erinomaisesti häihin, perhejuhliin ja yhteisiin aterioihin. Salin varusteluun kuuluvat pöytäliinat, valkoiset tuolinpäälliset, suuri näyttö, digitaalipiano, äänentoistolaitteet, mikrofonit ja kuvauspiste (photobooth). Kesäisin salia voidaan myös viilentää."""

[feature_welcome_title]
other = "Esteetön ja kutsuva"

[feature_welcome_description]
other = "Lepplaxin seurantalo toivottaa kaikki vieraat tervetulleiksi. Juhlasaliin on esteetön sisäänkäynti pyörätuoliluiskan kautta, ja tambuurissa on esteetön WC."

