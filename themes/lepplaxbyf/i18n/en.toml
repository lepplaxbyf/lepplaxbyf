[about_eyebrow]
other = "COMMUNITY WITH ROOM TO GROW"

[about_title]
other = "Make room for what you want to celebrate."

[about_description]
other = "Here there is room for both the big celebrations and the small moments together. The building is ready to be filled with people, conversations and memories."

[feature_kitchen_title]
other = "A kitchen ready to go"

[feature_kitchen_description]
other = """A well-equipped kitchen with plenty of workspace. Tableware and coffee service for 160 people. Large cold room, oven, stove, cooking pot, dishwasher, coffee maker, etc. Warming plate to keep food hot. On the lower floor there are two large refrigerators and a freezer."""

[feature_gather_title]
other = "Banquet hall ready for celebration"

[feature_gather_description]
other = """The bright banquet hall is suitable for weddings, parties, celebrations and shared meals. Includes tablecloths, white chair covers, large screen, electric digital piano, sound system, microphones, photo booth, etc. There is also the possibility of cooling during the summer."""

[feature_welcome_title]
other = "Welcoming for everyone"

[feature_welcome_description]
other = "Lepplax samlingshus is accessible to everyone and welcomes all guests. Wheelchair ramp with separate entrance to the banquet hall and accessible toilet in the entrance hall."

