<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <title>{{ block "title" . }}{{ with .Params.Title }}{{ . }} | {{ end }}{{ partial "site-title.html" . }}{{ end }}</title>
    <meta name="viewport" content="width=device-width,minimum-scale=1">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Site.Params.description }}{{ . }}{{ end }}{{ end }} {{ i18n "meta_owner" }}">
    {{ hugo.Generator }}
    {{ if and hugo.IsProduction (not .Params.private) }}
      <meta name="robots" content="index, follow">
    {{ else }}
      <meta name="robots" content="noindex, nofollow">
    {{ end }}
    <link rel="stylesheet" href="{{ "css/reset.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    <link rel="canonical" href="{{ .Permalink }}">
    {{ with .OutputFormats.Get "RSS" }}
      <link href="{{ .RelPermalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}">
    {{ end }}
  </head>
  <body>
    {{ partial "site-header.html" . }}
    <main role="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "site-footer.html" . }}
  </body>
</html>
